<!DOCTYPE html>
<html lang="en" data-brand-title="keep">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Shared files</title>
  <link rel="icon" href="/static/favicon.ico">
  <script src="/static/js/public-theme.js?v=20261125a"></script>
  <link rel="stylesheet" href="/static/css/tokens.css?v=20261125a">
  <link rel="stylesheet" href="/static/css/public-page.css?v=20261126d">
  <script src="/static/js/brand.js?v=20261126a"></script>
</head>
<body class="pp-card-page">
  <div class="wrap">
    <div class="card">
      <header class="pp-head">
        <p class="pp-brand"><img src="/static/assets/logo-small.png" alt="" data-brand-logo><span class="pp-name" data-brand-name>DockVault</span></p>
        <p class="pp-kind">Shared files</p>
      </header>

      <div id="loading" class="center">Loading&hellip;</div>

      <!-- secret prompt -->
      <form id="secret-form" class="hidden" autocomplete="off">
        <label id="secret-label" for="secret-input">This link is protected. Enter the code to open it.</label>
        <input id="secret-input" type="password" autocomplete="off" inputmode="text" />
        <button id="secret-submit" type="submit">Unlock</button>
        <div id="secret-error" class="msg error hidden"></div>
      </form>

      <!-- content -->
      <div id="content" class="hidden">
        <h1 id="title"></h1>
        <p id="owner-message" class="owner-message hidden"></p>
        <div id="listing"></div>
        <div id="dl-error" class="msg error hidden"></div>
        <div class="meta">A read-only link shared with you. It may expire or stop working later.</div>
      </div>

      <!-- terminal message (not found / errors) -->
      <div id="notice" class="hidden center"></div>
      <!-- This page records the visitor's address in the vault's audit log: say what is recorded. -->
      <p class="meta recording-link"><a href="/recording" target="_blank" rel="noopener">Privacy</a></p>
      <p id="powered-by" class="pp-powered">powered by <a data-powered-by-link href="https://dockvault.io" target="_blank" rel="noopener noreferrer"><span data-powered-by-name>DockVault</span></a></p>
    </div>
  </div>
  <script src="/static/js/public-link.js?v=20261125a" defer></script>
</body>
</html>
