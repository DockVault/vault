[pytest]
testpaths = tests
python_files = test_*.py
# --screenshot: a browser test that fails in CI currently leaves nothing to look at but an
# accessibility dump, which says what the page contained and not why. One failure cost an
# hour of hypotheses that the picture would have settled immediately -- an error toast is
# visible in a screenshot and absent from the tree. only-on-failure costs nothing on a
# passing run.
addopts = -ra --strict-config --strict-markers --base-url=http://localhost:8200
          --screenshot=only-on-failure --full-page-screenshot
markers =
    unit: tests that do not require a running DockVault deployment
    integration: tests that require a running DockVault deployment
    docker: tests that create throwaway Docker containers or volumes
    ui: browser-driven end-to-end tests (Playwright); slower, need Chromium installed
    websocket: tests that open the /ws/monitor websocket
    sftp: tests that connect to the live SFTP service
    slow: longer-running tests
    disruptive: restarts or reconfigures the running stack, so it cannot share a run
        with anything else; select it deliberately, on its own
    crypto_compatibility: pinned cryptographic format and behavior compatibility gate
    characterization: intentionally documents a named current behavior until hardening flips it
# A deadline on EVERY test, fixtures included (pytest-timeout). A hung test used to cost the CI
# job cap: the faulthandler dump in tests.yml says where it hung but does not end it, and a live
# module had to hand-sum a bound from every call's own timeout -- and one blocking call outside
# those bounds hung the run anyway. Now a future live module is bounded for free. Generous, because
# the live lanes move hundreds of megabytes through a container: a genuine test never comes near
# it, and a hang costs ten minutes instead of the cap. A module that needs more says so with
# @pytest.mark.timeout(n). Note what this does NOT do: `requests`' `timeout=` bounds each SOCKET
# operation, not a whole streamed request, so a live upload test still needs a deadline on the
# body generator it feeds -- this deadline is the backstop behind that, not a replacement for it.
timeout = 600
# Playwright: run headless by default (pass --headed to watch the browser)
