name: Tests

# Strict collection and the offline lane run in the preflight job. The tests that need a stack run
# beside it in shards: each shard builds the same-commit image, brings up its own Postgres, Redis,
# API, browser and SFTP stack, and runs its share of the test files. A last job joins every lane's
# JUnit report and fails unless each collected test ran exactly once. The configuration scenarios
# follow preflight on a stack of their own. Every credential is generated for one disposable runner.

on:
  pull_request:
  push:
    # main, and each maintenance line release/X.Y, which publishes too. Release candidates
    # (candidate/X.Y.Z) are tested by a manual run only.
    branches: ["main", "release/[0-9]+.[0-9]+"]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      expected_sha:
        description: Commit that every release gate must test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The release gate's image scan, on this exact commit and in parallel with the suites: it fails on
  # every High/Critical finding the reviewed VEX does not cover, whether or not a fix exists. A green
  # run on a release candidate therefore means the publish-time scan will pass too, and a new CVE is
  # decided before the release reaches main. Skipped on pull requests, whose own image-scan workflow
  # deliberately blocks only on findings a dependency bump could fix.
  image-scan:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/image-scan-pr.yml
    with:
      release_policy: true
    permissions:
      contents: read
  # The Fast workflow's lanes -- Windows and Ubuntu, installing ONLY the test lock -- on this exact
  # commit, when Tests is run by hand on a release candidate or runs inside a release (a tag). They are
  # the only lanes without the production lock, so a test that imports something only that lock carries
  # passes everywhere else and fails first here; without this job it first failed on main, after the
  # release it shipped with. A pull request and a push to main run the Fast workflow on their own.
  fast:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/fast-tests.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
    permissions:
      contents: read
  # The real-proxy matrix, on the same terms as the Fast lanes: a pull request runs it on its own,
  # and a candidate's manual run and a release's call run it here, on the commit under test, so the
  # client-address handling is proven behind real proxies before main moves and before publication.
  proxy-matrix:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/proxy-matrix.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
    permissions:
      contents: read
  preflight:
    uses: ./.github/workflows/preflight.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      # Keeps the offline lane's JUnit report, which the suite-report job joins with the shards'.
      offline_report_artifact: lane-results-offline
    permissions:
      contents: read
  # The suite runs as the offline lane (in preflight) and the stack tests, and the stack tests and
  # the configuration scenarios run in jobs of their own, each on its own runner and its own
  # disposable stack built from this commit.
  #
  # - integration: the tests that need a stack, against the shipped configuration, in six shards.
  #   `.github/suite-shards.json` records how long each test file took, and
  #   `.github/scripts/suite_shards.py` deals the files out so that the shards take about the same
  #   time. Each shard selects the offline lane's marker expression, negated: the offline tests ran
  #   in preflight and are not run a second time here, and a test marked docker, which the offline
  #   lane leaves out, runs here whatever else it is marked.
  # - scenarios: eight steps that each reconfigure the stack (a transfer ceiling that refuses, a
  #   free-space floor above the disk, log pull switched on, a vault-type allowlist, no storage
  #   ceiling, a Redis outage, a login limit of five, a small device-sync limit), recreate the API,
  #   run the few files that need that configuration, and put the shipped value back.
  # - suite-report: joins the offline lane's report with the shards' and fails unless every
  #   collected test is in exactly one of them, audits the joined report as the single job's report
  #   was audited, and checks that the tests of every file changed since the last release ran in
  #   their lanes.
  #
  # The suite used to be one job: about 15,000 tests in one process on one stack, 129 to 163
  # minutes, stopping at its first failure, so that three unrelated failures took three rounds to
  # see. It ran the offline tests a second time, after preflight had passed them. On the recorded
  # times the stack tests take 137 minutes in all and about 23 in each of six shards. The shards do
  # not wait for preflight: a shard's result is known in about half an hour whatever the offline
  # lane does, and the suite-report job needs both.
  #
  # The scenarios used to follow the suite in its job and took about 7.4 of its minutes. With
  # them in, the 0.32.6 job measured 49.5 minutes against a 60-minute cap, and the tests 0.33.0
  # adds were estimated to take it to 58-64. On their own runner they no longer compete with the
  # suite for one budget, and a failure in one does not hide a result from the other.
  #
  # A release calls this whole workflow (the `tests` job in release.yml), and a called workflow
  # succeeds only when every job in it succeeds, so publication waits for every shard, the
  # scenarios and the joined report. None of them may carry an `if` that would skip it on a tag: a
  # skipped job counts as passed.
  integration:
    name: Full suite, shard ${{ matrix.shard }} of 6 (API + browser + SFTP)
    runs-on: ubuntu-latest
    # The limit ends a hang; it is not a budget. On the recorded times a shard runs about 23
    # minutes of tests after about two of setup, on the slower of the two runners the single job was
    # measured on (they differed by 27% on the same tests). 60 is more than twice that, and far
    # under the 240 the single job needed.
    timeout-minutes: 60
    strategy:
      # A failure in one shard says nothing about the tests in another: let every shard finish, so
      # one round shows every failure.
      fail-fast: false
      matrix:
        # As many as `shards` in .github/suite-shards.json (a contract test holds the two together).
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Tags and history, because part of the suite checks the upgrade matrix against the releases
          # that actually exist (`git tag -l`) and against the versions this commit's history
          # prepared (`git log -- VERSION`). The default checkout is shallow and tagless, which made
          # the first check skip -- silently, and specifically here, in the job that gates
          # publication.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested commit
        if: ${{ inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            tests/requirements-test.lock

      - name: Generate and mask throwaway credentials
        shell: bash
        run: |
          set -euo pipefail
          ENCRYPTION_KEY="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          JWT_SECRET_KEY="$(openssl rand -hex 32)"
          VAULT_DB_PASSWORD="$(openssl rand -hex 16)"
          ADMIN_PASSWORD="$(openssl rand -base64 24)"
          for value in "$ENCRYPTION_KEY" "$JWT_SECRET_KEY" "$VAULT_DB_PASSWORD" "$ADMIN_PASSWORD"; do
            echo "::add-mask::${value}"
          done
          {
            echo "ENCRYPTION_KEY=${ENCRYPTION_KEY}"
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
            echo "VAULT_DB_PASSWORD=${VAULT_DB_PASSWORD}"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_EMAIL=admin@dockvault-ci.com"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "API_USE_HTTPS=false"
            echo "ENVIRONMENT=development"
            echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=240"
            echo "RATE_LIMIT_LOGIN_ATTEMPTS=2000"
            echo "RATE_LIMIT_VAULT_ATTEMPTS=2000"
            echo "RATE_LIMIT_VAULT_ATTEMPTS_ADMIN=2000"
            echo "RATE_LIMIT_API_DEFAULT=100000"
            echo "RATE_LIMIT_API_AUTH=100000"
            echo "RATE_LIMIT_API_UPLOAD=100000"
            echo "RATE_LIMIT_API_DOWNLOAD=100000"
            # The shipped default, stated rather than left implicit: the SSH-key throttle
            # test asks the deployment what budget it is enforcing, so that it can tell a
            # throttle which should have engaged from a deployment that cannot show one.
            echo "RATE_LIMIT_SFTP_KEY_ATTEMPTS=30"
            # A real storage ceiling, so the suite exercises the bounded admin limit
            # (the panel offers 0..MAX_STORAGE_GB) rather than only the unlimited default.
            echo "MAX_STORAGE_GB=64"
          } > .env
          {
            echo "VAULT_ADMIN_USER=admin"
            echo "VAULT_ADMIN_PASS=${ADMIN_PASSWORD}"
            echo "VAULT_API_CONTAINER=vault-api"
            echo "VAULT_DB_CONTAINER=vault-db"
            echo "VAULT_REDIS_CONTAINER=vault-redis"
            echo "VAULT_SFTP_HOST=127.0.0.1"
            echo "VAULT_SFTP_PORT=2322"
            echo "VAULT_SAME_COMMIT_CI=1"
          } >> "$GITHUB_ENV"

      - name: Build the image and start the stack
        # Measured at 42 seconds. Same reasoning as the step below: a stalled pull or build should
        # say so rather than being read later as a slow test suite.
        timeout-minutes: 20
        run: docker compose up -d --build

      - name: Wait for the API health gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body=""
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8200/health 2>/dev/null)"; then
              case "$body" in
                *'"database":"connected"'*)
                  echo "Vault healthy after ${attempt} attempt(s): ${body}"
                  exit 0
                  ;;
              esac
            fi
            sleep 5
          done
          echo "::error::Vault never reported healthy at http://127.0.0.1:8200/health"
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Wait for the SFTP banner
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            banner=""
            if banner="$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2322; head -c 4 <&3' 2>/dev/null)"; then
              case "$banner" in
                SSH-*)
                  echo "SFTP greeting received after ${attempt} attempt(s)"
                  exit 0
                  ;;
              esac
            fi
            sleep 2
          done
          echo "::error::SFTP never presented an SSH banner on 127.0.0.1:2322"
          docker compose logs --no-color --tail=200 vault-sftp
          exit 1

      - name: Install locked test dependencies and Chromium
        # Measured at 46 seconds on a healthy runner. It has hung for 35+ minutes twice, and with
        # no deadline of its own it consumes the job's whole budget and reports as a timeout of
        # the SUITE -- which is where someone then goes looking, and it is the wrong place.
        #
        # Established from the log of the second occurrence: it stalls in `apt-get update`, which
        # `--with-deps` invokes. The Azure mirror answered `Ign:` on every line, apt fell back to
        # archive.ubuntu.com, and the last output was `Get:5 noble-security InRelease` at
        # 02:27:10 -- then nothing for 43 minutes. Pip was never reached.
        #
        # The signature to recognise: the step's log ends mid-`apt-get update` with no error. That
        # is the shape a deadline turns into a ten-minute answer instead of a lost hour, and it is
        # also why the deadline goes on the step rather than being left to the job's.
        #
        # Ten minutes is thirteen times the measured cost: generous for a bad day, and a clear
        # answer instead of a lost hour.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install -r tests/requirements-test.lock
          python -m pip install --force-reinstall --require-hashes -r requirements.lock
          python -m pip check
          # NOT --with-deps. That flag is the only thing here that invokes apt, and apt is the
          # only thing here that has ever hung: three times now, each stalling on a mirror
          # mid-fetch with no error. Bounding it helped only in that the job now fails in ten
          # minutes instead of consuming forty-five -- the stall itself kept recurring, once
          # for nine minutes on a single HTTPS GET despite a twenty-second timeout, because
          # those timeouts bound a connection attempt and not a transfer that trickles.
          #
          # The runner image already ships the shared libraries Chromium needs -- which is why
          # Playwright's browsers come preinstalled on it. Nothing is taken on trust either:
          # the next step launches Chromium against the running API and fails loudly if a
          # library really is missing, which is a better signal than a silent apt stall.
          python -m playwright install chromium

      - name: Verify Chromium launches against the API
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto(
                  "http://127.0.0.1:8200/",
                  wait_until="domcontentloaded",
                  timeout=15_000,
              )
              if response is None or not response.ok:
                  raise SystemExit("Chromium could not load the running vault")
              browser.close()
          PY

      # faulthandler_timeout: pytest's built-in watchdog. If ONE test runs past this many seconds,
      # every thread's stack in the test process is dumped to this log -- and the test goes on. The
      # slowest legitimate module here takes about two minutes; a suite that has hung three times
      # deserves a standing instrument that says WHERE it is stuck, not only that it is. Without it a
      # hang is a log of dots until the job cap, which also loses the JUnit report below (the file is
      # written at session end, which a capped run never reaches).
      #
      # VAULT_SFTP_STREAMING=1 opts tests/test_sftp_streaming_upload.py in: those tests hold only where
      # the SFTP server streams uploads, which the shipped default does (SFTP_STREAMING_UPLOAD is not
      # set in this job's .env). The SFTP container is asked first, so the opt-in is never given to a
      # stack that buffers; it is given to this command only, and every other step runs as before.
      # The question builds Settings() from the container's environment, as the server does when it
      # starts: the module's `settings` object holds only the defaults until a server fills it in, so
      # reading that would answer True whatever the container was given.
      #
      # The shard's files come from the committed times (see the job's comment); pytest reads them
      # from the file, one argument a line. The marker expression is the offline lane's, negated, so
      # between them preflight and the shards select every test once. --maxfail=25, not 1: a round
      # shows up to 25 failures of each shard, and a stack that has gone away still ends the run
      # instead of failing every test left.
      - name: Run this shard of the suite
        run: |
          set -euo pipefail
          streaming="$(docker compose exec -T vault-sftp python -c 'from app.core.config import Settings; print(Settings().sftp_streaming_upload)')"
          test "$streaming" = "True"
          python .github/scripts/suite_shards.py files --shard ${{ matrix.shard }} > shard-files.txt
          VAULT_SFTP_STREAMING=1 python -m pytest @shard-files.txt -m "not (unit and not docker)" --maxfail=25 --junitxml=suite-results.xml -o faulthandler_timeout=300

      # Keep the JUnit report -- it holds the per-test durations. Uploaded always (not only on
      # failure), so it survives a failing run too: the suite-report job joins the shards' reports
      # with the offline lane's and checks that every collected test is in exactly one, and the
      # durations are the data for rebalancing the shards and for spotting a test that has been
      # quietly getting slower.
      - name: Keep the shard's report (durations + results)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-results-shard-${{ matrix.shard }}
          path: suite-results.xml
          if-no-files-found: warn
          retention-days: 14

      # A browser failure here used to leave only the accessibility dump Playwright prints, which
      # says what the page contained and not why. One such failure cost an hour of hypotheses --
      # each plausible, each wrong -- that a picture of the page would have settled at once: an
      # error toast shows in a screenshot and is absent from the tree. Kept only when something
      # failed, so a green run uploads nothing.
      - name: Keep the picture of a failed browser test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failure-screenshots-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # On a failure AND on a cancel, quiet on green. `failure()` alone skipped exactly the case that
      # most needs the logs: a job killed by its cap is `cancelled`, not `failure`, and three capped
      # runs left no container log at all. Not `!success()`, tempting as it reads: once a job is
      # cancelled GitHub skips every remaining step unless its condition NAMES `always()` or
      # `cancelled()` -- a condition that merely evaluates true is not enough -- so the
      # cancel-aware function has to be spelled out here for the step to run at all.
      - name: Container logs
        if: ${{ failure() || cancelled() }}
        run: docker compose logs --no-color --tail=400

      - name: Tear the stack down
        if: always()
        run: docker compose down -v --remove-orphans

  # The configuration scenarios, on a stack of their own. The setup below is the integration
  # job's setup, step for step (a contract test compares the two), so every scenario starts from
  # the stack the suite runs on and changes only the one setting it is about. Each step puts that
  # setting back before the next, as it did when these steps followed the suite.
  scenarios:
    name: Configuration scenarios (API + browser + SFTP)
    needs: preflight
    runs-on: ubuntu-latest
    # In the suite's job, setup took about two minutes and the six steps 7.4. 30 minutes is about
    # three times that: room for a slow day, and a hang is still reported in half an hour rather
    # than consuming the suite's cap. The seventh, the size accounting with no storage ceiling,
    # adds about a minute and a half (its file took 39 seconds when measured, plus two recreates
    # of the API).
    timeout-minutes: 30

    steps:
