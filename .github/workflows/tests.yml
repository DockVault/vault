              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto(
                  "http://127.0.0.1:8200/",
                  wait_until="domcontentloaded",
                  timeout=15_000,
              )
              if response is None or not response.ok:
                  raise SystemExit("Chromium could not load the running vault")
              browser.close()
          PY

      # Eight tests in tests/test_transfer_admission_live.py are gated on a deployment configured
      # to refuse rather than queue, and nothing set that up, so they ran nowhere. Same shape as
      # the throttle step below: reconfigure, recreate, run, put it back.
      #
      # BOTH knobs are needed. With a queue, a second transfer WAITS rather than being refused,
      # which is the correct product behaviour and the opposite of what these tests assert.
      - name: Exercise the transfer ceiling on a deployment that refuses
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^MAX_CONCURRENT_TRANSFERS=/d;/^MAX_QUEUED_TRANSFERS=/d' .env
          echo 'MAX_CONCURRENT_TRANSFERS=1' >> .env
          echo 'MAX_QUEUED_TRANSFERS=0' >> .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not come back with the transfer ceiling applied"
              exit 1
            fi
            sleep 3
          done
          VAULT_TRANSFER_LIMIT_IS_ONE=1 python -m pytest tests/test_transfer_admission_live.py --maxfail=1
          # Put the shipped values back before the next step, which recreates the API again and
          # would otherwise run its own tests against a deployment that refuses every second
          # transfer.
          sed -i '/^MAX_CONCURRENT_TRANSFERS=/d;/^MAX_QUEUED_TRANSFERS=/d' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring the shipped ceiling"
              exit 1
            fi
            sleep 3
          done

      # The free space the storage volume keeps (MIN_FREE_SPACE_GB) refuses an upload, an SFTP write or a copy that
      # would leave less. No runner's disk is that full, so the floor is set above the volume's size: every write
      # would leave less than it. Both servers read it, so both are recreated; the report must show every test of
      # the file ran, and the shipped value is put back after.
      - name: Exercise the free-space floor set above the disk's size
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^MIN_FREE_SPACE_GB=/d' .env
          echo 'MIN_FREE_SPACE_GB=1000000' >> .env
          docker compose up -d --force-recreate vault-api vault-sftp
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1 \
                && docker compose exec -T vault-sftp python -c "import socket; socket.create_connection(('127.0.0.1', 2222), 3)" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::the servers did not come back with the free-space floor applied"
              exit 1
            fi
            sleep 3
          done
          VAULT_FREE_SPACE_FLOOR_ABOVE_THE_DISK=1 python -m pytest tests/test_free_space_floor_live.py --maxfail=1 \
            --junitxml=floor-junit.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = [c for c in ET.parse("floor-junit.xml").getroot().iter("testcase")
                   if c.get("classname", "").endswith("test_free_space_floor_live")]
          ran = [c.get("name") for c in cases
                 if c.find("skipped") is None and c.find("failure") is None and c.find("error") is None]
          print(f"free-space floor: {len(ran)} of {len(cases)} ran and passed")
          if len(cases) < 8 or len(ran) != len(cases):
              sys.exit("::error::the free-space floor tests did not all run")
          PY
          sed -i '/^MIN_FREE_SPACE_GB=/d' .env
          docker compose up -d --force-recreate vault-api vault-sftp
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1 \
                && docker compose exec -T vault-sftp python -c "import socket; socket.create_connection(('127.0.0.1', 2222), 3)" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::the servers did not return after restoring the shipped free-space floor"
              exit 1
            fi
            sleep 3
          done

      # The log-pull endpoint sits behind a process-start ceiling that defaults off and is
      # set in no workflow, so seven checks across four files -- including the ones asserting
      # that a web-scoped token is refused on sftp -- have never run with it on. Same shape
      # as the transfer ceiling above: turn it on, run, put it back.
      #
      # The pepper is not decoration. Without a strong one the vault starts normally and
      # log-pull stays off with only a warning on stderr, which is how these tests came to
      # skip everywhere in the first place. So the ceiling is asserted before anything runs:
      # a step that silently reproduced the original condition would be worse than no step.
      - name: Exercise the log-pull endpoint with its ceiling on
        shell: bash
        run: |
          set -euo pipefail
          LOG_TOKEN_PEPPER="$(openssl rand -hex 32)"
          echo "::add-mask::${LOG_TOKEN_PEPPER}"
          sed -i '/^PLAN_LOG_PULL=/d;/^LOG_TOKEN_PEPPER=/d' .env
          echo 'PLAN_LOG_PULL=true' >> .env
          echo "LOG_TOKEN_PEPPER=${LOG_TOKEN_PEPPER}" >> .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not come back with the log ceiling applied"
              exit 1
            fi
            sleep 3
          done
          python - <<'PY'
          import os
          import sys

          import requests

          BASE = "http://127.0.0.1:8200"
          session = requests.Session()
          login = session.post(
              f"{BASE}/auth/login",
              json={"username": os.environ["VAULT_ADMIN_USER"],
                    "password": os.environ["VAULT_ADMIN_PASS"]},
              timeout=15,
          )
          login.raise_for_status()
          session.headers["Authorization"] = f"Bearer {login.json()['access_token']}"
          settings = session.get(f"{BASE}/settings/logs", timeout=15)
          settings.raise_for_status()
          if not settings.json().get("ceiling"):
              sys.exit(
                  "::error::the log ceiling is still off after the recreate, so the tests "
                  "below would skip exactly as they always have"
              )
          print("log ceiling confirmed on")
          PY
          python -m pytest tests/test_api_log_pull.py tests/test_api_log_sink_availability.py \
            tests/test_ui_log_access.py tests/test_ui_log_token_usage.py --maxfail=1
          # Back to the shipped default. The ceiling-off assertions live in the same files and
          # ran in the main pass, so nothing below needs it on.
          sed -i '/^PLAN_LOG_PULL=/d;/^LOG_TOKEN_PEPPER=/d' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring the shipped ceiling"
              exit 1
            fi
            sleep 3
          done

      # The allowlist of creatable vault types is a comma-list that ships empty, meaning
      # everything is permitted, and no workflow has ever set it -- so the check that a
      # forbidden type is refused, and that nothing is persisted when it is, has never run.
      #
      # It cannot be restricted for the whole suite: most of the suite creates
      # zero-knowledge vaults, which is exactly what gets forbidden here. Hence a step, and
      # hence putting the shipped default back before the next one.
      - name: Exercise the vault-type allowlist against a forbidden type
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^PLAN_ALLOWED_VAULT_TYPES=/d' .env
          echo 'PLAN_ALLOWED_VAULT_TYPES=standard' >> .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not come back with the vault-type allowlist applied"
              exit 1
            fi
            sleep 3
          done
          # The flag tells the test that this round staged the restriction, so that skipping
          # the forbid path here is a failure rather than a deployment it cannot exercise.
          VAULT_TYPE_ALLOWLIST_RESTRICTED=1 \
            python -m pytest tests/test_vault_type_allowlist.py --maxfail=1
          sed -i '/^PLAN_ALLOWED_VAULT_TYPES=/d' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring the permissive allowlist"
              exit 1
            fi
            sleep 3
          done

      # Both stack jobs set MAX_STORAGE_GB=64, so there every upload, copy and move that finishes
      # takes the deployment's storage turn as well as the vault's row lock. The shipped default
      # sets no ceiling, and then the vault's row lock alone keeps a vault inside its size limit
      # when files finish at the same moment: that was checked by the offline lane only. So the
      # size-accounting file runs once more with the ceiling removed and no live limit saved, which
      # is asserted before the tests run, and its report must show every test in it ran. Before
      # the throttle steps below, which leave a login limit of five that these tests' sign-ins
      # would exceed.
      - name: Exercise the size accounting with no storage ceiling
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^MAX_STORAGE_GB=/d' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not come back without the storage ceiling"
              exit 1
            fi
            sleep 3
          done
          python - <<'PY'
          import os
          import sys

          import requests

          BASE = "http://127.0.0.1:8200"
          login = requests.post(
              f"{BASE}/auth/login",
              json={"username": os.environ["VAULT_ADMIN_USER"],
                    "password": os.environ["VAULT_ADMIN_PASS"]},
              timeout=15,
          )
          login.raise_for_status()
          settings = requests.get(
              f"{BASE}/settings",
              headers={"Authorization": f"Bearer {login.json()['access_token']}"},
              timeout=15,
          )
          settings.raise_for_status()
          body = settings.json()
          # Both keys answered first: a key missing would read as no limit, and the step would pass unchecked.
          missing = [key for key in ("deployment_storage_max_gb", "deployment_storage_limit_bytes")
                     if key not in body]
          if missing:
              sys.exit("::error::/settings does not answer " + ", ".join(missing)
                       + ", so whether the deployment has a storage limit cannot be told")
          if body["deployment_storage_max_gb"] is not None or body["deployment_storage_limit_bytes"] is not None:
              sys.exit(
                  "::error::the deployment still has a storage limit "
                  f"(maximum {body['deployment_storage_max_gb']!r} GB, limit "
                  f"{body['deployment_storage_limit_bytes']!r} bytes), so the tests below would "
                  "not check the vault's row lock on its own"
              )
          print("no storage ceiling and no live limit")
          PY
          python -m pytest tests/test_vault_size_accounting.py --maxfail=1 --junitxml=size-junit.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("size-junit.xml").getroot()
          cases = [c for c in root.iter("testcase")
                   if c.get("classname", "").endswith("test_vault_size_accounting")]
          ran = [c.get("name") for c in cases
                 if c.find("skipped") is None and c.find("failure") is None and c.find("error") is None]
          print(f"size accounting without a ceiling: {len(ran)} of {len(cases)} ran and passed")
          for name in ran:
              print(f"  ran: {name}")
          if len(cases) < 7 or len(ran) != len(cases):
              sys.exit("::error::the size-accounting tests did not all run without the ceiling")
          PY
          echo 'MAX_STORAGE_GB=64' >> .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring the storage ceiling"
              exit 1
            fi
            sleep 3
          done

      # This check gates on VAULT_REDIS_OUTAGE_TEST, which was set only on the command line
      # of an invocation naming a different file -- so the assertion that the general API
      # classes stay available while Redis is down was selected nowhere.
      #
      # It runs before the step below rather than inside it: that step lowers the login limit
      # to five on purpose, and the rest of this file logs in often enough to be refused by
      # it. Nothing here needs the lowered limit -- the flag is read by the test, not the
      # server -- so the two are kept apart. The test pauses the container and unpauses it in
      # a finally, waiting for health before it returns.
      #
      # The in-flight upload marker's outage case (an SFTP upload still signs in and is written
      # while Redis is down, with no marker row) is gated on the same flag and was selected
      # nowhere either. It pauses Redis itself and waits the breaker out before it returns.
      - name: Exercise the general API fail-open during a Redis outage
        shell: bash
        run: |
          set -euo pipefail
          VAULT_REDIS_OUTAGE_TEST=1 \
          VAULT_REDIS_CONTAINER=vault-redis \
            python -m pytest tests/test_api_rate_limit_classes.py::test_general_api_classes_fail_open_during_redis_outage tests/test_auth_survives_cache_outage.py tests/test_auth_offload_under_outage.py tests/test_redis_breaker_heal_under_outage.py tests/test_inflight_upload_markers_live.py::test_breaker_open_skips_the_marker_and_still_allows_the_upload --maxfail=1 --junitxml=outage-junit.xml
          # Guard against a silently vacuous step: at least one non-skipped test must have run (an
          # opt-in gate or a missing precondition skipping the lot would otherwise pass green).
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("outage-junit.xml").getroot()
          tests = sum(int(s.get("tests", 0)) for s in root.iter("testsuite"))
          skipped = sum(int(s.get("skipped", 0)) for s in root.iter("testsuite"))
          print(f"outage step: {tests - skipped} ran, {skipped} skipped, {tests} collected")
          if tests - skipped < 1:
              sys.exit("::error::the Redis-outage step ran no non-skipped tests (vacuous)")
          PY
          # The test unpauses the container and waits for the API to report the connection
          # back, which is not the same as docker calling it healthy again: a paused
          # container cannot answer its own healthcheck, so that verdict only clears on the
          # next successful probe. The step below recreates a service declared
          # `condition: service_healthy` on redis and fails outright while it is stale.
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' vault-redis 2>/dev/null || echo unknown)"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::vault-redis did not return to healthy after the outage test (last seen: ${status})"
              exit 1
            fi
            sleep 2
          done

      - name: Exercise login throttling and Redis outage fallback
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^RATE_LIMIT_LOGIN_ATTEMPTS=.*/RATE_LIMIT_LOGIN_ATTEMPTS=5/' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            body=""
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8200/health 2>/dev/null)"; then
              case "$body" in
                *'"database":"connected"'*) break ;;
              esac
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring shipped limits"
              exit 1
            fi
            sleep 3
          done
          docker compose exec -T vault-redis redis-cli FLUSHALL
          VAULT_REDIS_OUTAGE_TEST=1 \
          VAULT_REDIS_CONTAINER=vault-redis \
            python -m pytest tests/test_login_throttle.py tests/test_device_sync_throttle.py --maxfail=1 --junitxml=throttle-junit.xml
          # The whole point of this step is that the device-sync/login throttle tests RUN on the
          # small-limit stack. Assert several non-skipped tests actually ran, so a guard that skipped
          # the module (e.g. a misread login limit) cannot pass this step green.
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("throttle-junit.xml").getroot()
          tests = sum(int(s.get("tests", 0)) for s in root.iter("testsuite"))
          skipped = sum(int(s.get("skipped", 0)) for s in root.iter("testsuite"))
          print(f"throttle step: {tests - skipped} ran, {skipped} skipped, {tests} collected")
          if tests - skipped < 3:
              sys.exit("::error::the throttle step ran fewer than 3 non-skipped tests (the throttle "
                       "modules were skipped, not exercised)")
          PY

      - name: Exercise the device-sync pre-flight states
        shell: bash
        run: |
          set -euo pipefail
          # The rate-limited state is reachable only when the device-sync rate limit sits BELOW the
          # per-device credential cap, so the SFTP-auth bucket trips before unspent creds fill the cap
          # (above it, the honest answer is legitimately cap-reached and the rate case skips). Set a
          # small limit and recreate the API on it.
          if grep -q '^RATE_LIMIT_DEVICE_SYNC_ATTEMPTS=' .env; then
            sed -i 's/^RATE_LIMIT_DEVICE_SYNC_ATTEMPTS=.*/RATE_LIMIT_DEVICE_SYNC_ATTEMPTS=3/' .env
          else
            echo 'RATE_LIMIT_DEVICE_SYNC_ATTEMPTS=3' >> .env
          fi
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            body=""
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8200/health 2>/dev/null)"; then
              case "$body" in
                *'"database":"connected"'*) break ;;
              esac
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after setting a small device-sync rate limit"
              exit 1
            fi
            sleep 3
          done
          docker compose exec -T vault-redis redis-cli FLUSHALL
          # VAULT_REDIS_OUTAGE_TEST opts the server-not-ready case in: it pauses Redis itself and
          # waits the breaker out afterwards, so the step leaves the stack as it found it.
          VAULT_REDIS_OUTAGE_TEST=1           VAULT_REDIS_CONTAINER=vault-redis             python -m pytest tests/test_device_sync_preflight_live.py --maxfail=1 --junitxml=preflight-junit.xml
          # The point of this step is that the pre-flight states RUN here (rate-limited needs the small
          # limit, server-not-ready needs the opt-in). Assert most of the module actually ran, so a
          # guard that skipped it cannot pass this step green.
          python - <<'PYCHECK'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("preflight-junit.xml").getroot()
          tests = sum(int(s.get("tests", 0)) for s in root.iter("testsuite"))
          skipped = sum(int(s.get("skipped", 0)) for s in root.iter("testsuite"))
          print(f"pre-flight step: {tests - skipped} ran, {skipped} skipped, {tests} collected")
          if tests - skipped < 5:
              sys.exit("::error::the pre-flight step ran fewer than 5 non-skipped tests (the module "
                       "was skipped, not exercised)")
          PYCHECK
          # The server-not-ready case paused Redis; recreate below declares redis service_healthy, so
          # make sure it came back healthy before later steps run.
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' vault-redis 2>/dev/null || echo unknown)"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::vault-redis did not return to healthy after the pre-flight step (last seen: ${status})"
              exit 1
            fi
            sleep 2
          done

      # A browser failure here used to leave only the accessibility dump Playwright prints, which
      # says what the page contained and not why. One such failure cost an hour of hypotheses --
      # each plausible, each wrong -- that a picture of the page would have settled at once: an
      # error toast shows in a screenshot and is absent from the tree. Kept only when something
      # failed, so a green run uploads nothing.
      - name: Keep the picture of a failed browser test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failure-screenshots-scenarios
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # On a failure AND on a cancel, quiet on green. `failure()` alone skipped exactly the case that
      # most needs the logs: a job killed by its cap is `cancelled`, not `failure`, and three capped
      # runs left no container log at all. Not `!success()`, tempting as it reads: once a job is
      # cancelled GitHub skips every remaining step unless its condition NAMES `always()` or
      # `cancelled()` -- a condition that merely evaluates true is not enough -- so the
      # cancel-aware function has to be spelled out here for the step to run at all.
      - name: Container logs
        if: ${{ failure() || cancelled() }}
        run: docker compose logs --no-color --tail=400

      - name: Tear the stack down
        if: always()
        run: docker compose down -v --remove-orphans

  # The suite's result as a whole. One pytest session wrote one report, and comparing its count
  # with the collection showed that every test had run. Seven sessions (the offline lane and six
  # shards) can each be complete and still, between them, leave a test out or run one twice, so
  # this job compares names: it collects the suite, and every collected test must be in exactly one
  # lane's report. Then the audit the single job ran reads the joined report: no failure, the
  # collected count, and the skip ceiling.
  #
  # always(): it runs after a failed shard or a failed offline lane too, so one round shows every
  # lane's result and every test that did not run. That cannot turn a failed lane green: the lane's
  # own job has failed, and a lane whose tests failed or were cut short has failures in its report,
  # tests missing from it, or no report at all, each of which fails the join or the audit. It has
  # no other condition, so it is never skipped on a tag.
  #
  # `fast` is needed for its reports only, and is skipped on a pull request and a push, where the
  # Fast workflow runs on its own; the check below then looks at the lanes of this run.
  suite-report:
    name: Full suite report (every test ran exactly once)
    needs: [preflight, integration, fast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Two collections of about a minute each, an install of about a minute, and scripts that take
    # seconds. The limit ends a hang.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Tags and history: the changed-test check below compares this commit with the last
          # release tag, and the collection must see what the other lanes' collections saw.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify requested commit
        if: ${{ inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            tests/requirements-test.lock

      # The packages preflight and the shards have: the test lock, then the production lock over
      # it. This job runs no test, but the names it collects are compared with those lanes'
      # reports and their number with preflight's count, and what is installed can change what a
      # test file collects: a file that skips itself when a package is missing collects nothing
      # without it.
      - name: Install locked test dependencies
        run: |
          python -m pip install -r tests/requirements-test.lock
          python -m pip install --force-reinstall --require-hashes -r requirements.lock
          python -m pip check

      # The names every lane's report is compared with. The second collection is the offline lane's
      # selection: it tells the changed-test check which lanes a test belongs in.
      - name: Collect the suite's test names
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q > collected.txt
          python -m pytest --collect-only -q -m "unit and not docker" > collected-offline.txt
          tail -n 1 collected.txt collected-offline.txt

      # Every artifact named lane-results-*: the offline lane's, each shard's and, when they ran in
      # this run, the two Fast lanes'. Each lands in a directory named after its artifact. A lane
      # that kept no report leaves nothing here, and the join below says which one is missing.
      - name: Fetch every lane's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lane-results-*
          path: reports

      - name: Show the shards' recorded balance
        run: python .github/scripts/suite_shards.py balance

      - name: Join the lanes' reports and check that every test ran exactly once
        run: |
          set -euo pipefail
          shards="$(python .github/scripts/suite_shards.py count)"
          reports=(--report "offline=reports/lane-results-offline/offline-results.xml")
          for shard in $(seq 1 "$shards"); do
            reports+=(--report "shard-${shard}=reports/lane-results-shard-${shard}/suite-results.xml")
          done
          python .github/scripts/join_suite_reports.py --collected collected.txt "${reports[@]}" --output pytest-results.xml

      # One report for the run, under the name the single job's report had, so whatever reads the
      # per-test durations keeps working. Uploaded always, so a failing run keeps what it has.
      - name: Keep the joined report (durations + results)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Audit the joined report
        run: >-
          python .github/scripts/pytest_result_audit.py pytest-results.xml
          --expected-total "${{ needs.preflight.outputs.test-count }}"

      # A new or changed test proves nothing on a system it never ran on. For every test file added
      # or changed since the last release tag, each of its tests must be in the reports of the lanes
      # that run it: an offline test in every offline lane of this run, a stack test in a shard's.
      # A manual run on a release candidate and a release's call include the Fast lanes, so there
      # the Windows lane's report is required too. Run after a failed join as well: it reads other
      # things, and a round should show both.
      - name: Check that the tests changed since the last release ran in their lanes
        if: always()
        env:
          FAST_LANES: ${{ needs.fast.result }}
        run: |
          set -euo pipefail
          lanes=(--offline-lane "preflight=reports/lane-results-offline/offline-results.xml")
          if [ "$FAST_LANES" != "skipped" ]; then
            lanes+=(--offline-lane "linux=reports/lane-results-fast-ubuntu-latest/fast-results.xml")
            lanes+=(--offline-lane "windows=reports/lane-results-fast-windows-latest/fast-results.xml")
          else
            echo "::notice::the Fast lanes are not part of this run, so the Windows lane is not looked at here"
          fi
          python .github/scripts/changed_tests_ran.py --collected collected.txt --offline-collected collected-offline.txt "${lanes[@]}" --stack-report reports/lane-results-shard-*/suite-results.xml
