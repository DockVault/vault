name: Tests

# Run strict collection and the offline lane before any image build or browser install.
# The full job then exercises the same-commit image over the real Postgres, Redis, API,
# browser, and SFTP stack. Every credential is generated for one disposable runner.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      expected_sha:
        description: Commit that every release gate must test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
    permissions:
      contents: read
  integration:
    name: Full suite (API + browser + SFTP)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Tags, because part of the suite checks the upgrade matrix against the releases that
          # actually exist. The default checkout is shallow and tagless, which made that check skip
          # -- silently, and specifically here, in the job that gates publication. Tags only, not
          # full history: the check reads `git tag -l`.
          fetch-tags: true
          persist-credentials: false

      - name: Verify requested commit
        if: ${{ inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            tests/requirements-test.lock

      - name: Generate and mask throwaway credentials
        shell: bash
        run: |
          set -euo pipefail
          ENCRYPTION_KEY="$(python -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          JWT_SECRET_KEY="$(openssl rand -hex 32)"
          VAULT_DB_PASSWORD="$(openssl rand -hex 16)"
          ADMIN_PASSWORD="$(openssl rand -base64 24)"
          for value in "$ENCRYPTION_KEY" "$JWT_SECRET_KEY" "$VAULT_DB_PASSWORD" "$ADMIN_PASSWORD"; do
            echo "::add-mask::${value}"
          done
          {
            echo "ENCRYPTION_KEY=${ENCRYPTION_KEY}"
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
            echo "VAULT_DB_PASSWORD=${VAULT_DB_PASSWORD}"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_EMAIL=admin@dockvault-ci.com"
            echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            echo "API_USE_HTTPS=false"
            echo "ENVIRONMENT=development"
            echo "JWT_ACCESS_TOKEN_EXPIRE_MINUTES=240"
            echo "RATE_LIMIT_LOGIN_ATTEMPTS=2000"
            echo "RATE_LIMIT_VAULT_ATTEMPTS=2000"
            echo "RATE_LIMIT_VAULT_ATTEMPTS_ADMIN=2000"
            echo "RATE_LIMIT_API_DEFAULT=100000"
            echo "RATE_LIMIT_API_AUTH=100000"
            echo "RATE_LIMIT_API_UPLOAD=100000"
            echo "RATE_LIMIT_API_DOWNLOAD=100000"
            # The shipped default, stated rather than left implicit: the SSH-key throttle
            # test asks the deployment what budget it is enforcing, so that it can tell a
            # throttle which should have engaged from a deployment that cannot show one.
            echo "RATE_LIMIT_SFTP_KEY_ATTEMPTS=30"
            # A real storage ceiling, so the suite exercises the bounded admin limit
            # (the panel offers 0..MAX_STORAGE_GB) rather than only the unlimited default.
            echo "MAX_STORAGE_GB=64"
          } > .env
          {
            echo "VAULT_ADMIN_USER=admin"
            echo "VAULT_ADMIN_PASS=${ADMIN_PASSWORD}"
            echo "VAULT_API_CONTAINER=vault-api"
            echo "VAULT_DB_CONTAINER=vault-db"
            echo "VAULT_REDIS_CONTAINER=vault-redis"
            echo "VAULT_SFTP_HOST=127.0.0.1"
            echo "VAULT_SFTP_PORT=2322"
            echo "VAULT_SAME_COMMIT_CI=1"
          } >> "$GITHUB_ENV"

      - name: Build the image and start the stack
        run: docker compose up -d --build

      - name: Wait for the API health gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body=""
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8200/health 2>/dev/null)"; then
              case "$body" in
                *'"database":"connected"'*)
                  echo "Vault healthy after ${attempt} attempt(s): ${body}"
                  exit 0
                  ;;
              esac
            fi
            sleep 5
          done
          echo "::error::Vault never reported healthy at http://127.0.0.1:8200/health"
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Wait for the SFTP banner
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            banner=""
            if banner="$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2322; head -c 4 <&3' 2>/dev/null)"; then
              case "$banner" in
                SSH-*)
                  echo "SFTP greeting received after ${attempt} attempt(s)"
                  exit 0
                  ;;
              esac
            fi
            sleep 2
          done
          echo "::error::SFTP never presented an SSH banner on 127.0.0.1:2322"
          docker compose logs --no-color --tail=200 vault-sftp
          exit 1

      - name: Install locked test dependencies and Chromium
        run: |
          set -euo pipefail
          python -m pip install -r tests/requirements-test.lock
          python -m pip install --force-reinstall --require-hashes -r requirements.lock
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Verify Chromium launches against the API
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              response = page.goto(
                  "http://127.0.0.1:8200/",
                  wait_until="domcontentloaded",
                  timeout=15_000,
              )
              if response is None or not response.ok:
                  raise SystemExit("Chromium could not load the running vault")
              browser.close()
          PY

      - name: Run the full test suite
        run: python -m pytest --maxfail=1 --junitxml=pytest-results.xml

      - name: Audit the successful full report
        run: >-
          python .github/scripts/pytest_result_audit.py pytest-results.xml
          --expected-total "${{ needs.preflight.outputs.test-count }}"

      # Eight tests in tests/test_transfer_admission_live.py are gated on a deployment configured
      # to refuse rather than queue, and nothing set that up, so they ran nowhere. Same shape as
      # the throttle step below: reconfigure, recreate, run, put it back.
      #
      # BOTH knobs are needed. With a queue, a second transfer WAITS rather than being refused,
      # which is the correct product behaviour and the opposite of what these tests assert.
      - name: Exercise the transfer ceiling on a deployment that refuses
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^MAX_CONCURRENT_TRANSFERS=/d;/^MAX_QUEUED_TRANSFERS=/d' .env
          echo 'MAX_CONCURRENT_TRANSFERS=1' >> .env
          echo 'MAX_QUEUED_TRANSFERS=0' >> .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not come back with the transfer ceiling applied"
              exit 1
            fi
            sleep 3
          done
          VAULT_TRANSFER_LIMIT_IS_ONE=1 python -m pytest tests/test_transfer_admission_live.py --maxfail=1
          # Put the shipped values back before the next step, which recreates the API again and
          # would otherwise run its own tests against a deployment that refuses every second
          # transfer.
          sed -i '/^MAX_CONCURRENT_TRANSFERS=/d;/^MAX_QUEUED_TRANSFERS=/d' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring the shipped ceiling"
              exit 1
            fi
            sleep 3
          done

      # The log-pull endpoint sits behind a process-start ceiling that defaults off and is
      # set in no workflow, so seven checks across four files -- including the ones asserting
      # that a web-scoped token is refused on sftp -- have never run with it on. Same shape
      # as the transfer ceiling above: turn it on, run, put it back.
      #
      # The pepper is not decoration. Without a strong one the vault starts normally and
      # log-pull stays off with only a warning on stderr, which is how these tests came to
      # skip everywhere in the first place. So the ceiling is asserted before anything runs:
      # a step that silently reproduced the original condition would be worse than no step.
      - name: Exercise the log-pull endpoint with its ceiling on
        shell: bash
        run: |
          set -euo pipefail
          LOG_TOKEN_PEPPER="$(openssl rand -hex 32)"
          echo "::add-mask::${LOG_TOKEN_PEPPER}"
          sed -i '/^PLAN_LOG_PULL=/d;/^LOG_TOKEN_PEPPER=/d' .env
          echo 'PLAN_LOG_PULL=true' >> .env
          echo "LOG_TOKEN_PEPPER=${LOG_TOKEN_PEPPER}" >> .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not come back with the log ceiling applied"
              exit 1
            fi
            sleep 3
          done
          python - <<'PY'
          import os
          import sys

          import requests

          BASE = "http://127.0.0.1:8200"
          session = requests.Session()
          login = session.post(
              f"{BASE}/auth/login",
              json={"username": os.environ["VAULT_ADMIN_USER"],
                    "password": os.environ["VAULT_ADMIN_PASS"]},
              timeout=15,
          )
          login.raise_for_status()
          session.headers["Authorization"] = f"Bearer {login.json()['access_token']}"
          settings = session.get(f"{BASE}/settings/logs", timeout=15)
          settings.raise_for_status()
          if not settings.json().get("ceiling"):
              sys.exit(
                  "::error::the log ceiling is still off after the recreate, so the tests "
                  "below would skip exactly as they always have"
              )
          print("log ceiling confirmed on")
          PY
          python -m pytest tests/test_api_log_pull.py tests/test_api_log_sink_availability.py \
            tests/test_ui_log_access.py tests/test_ui_log_token_usage.py --maxfail=1
          # Back to the shipped default. The ceiling-off assertions live in the same files and
          # ran in the main pass, so nothing below needs it on.
          sed -i '/^PLAN_LOG_PULL=/d;/^LOG_TOKEN_PEPPER=/d' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:8200/health >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring the shipped ceiling"
              exit 1
            fi
            sleep 3
          done

      # This check gates on VAULT_REDIS_OUTAGE_TEST, which was set only on the command line
      # of an invocation naming a different file -- so the assertion that the general API
      # classes stay available while Redis is down was selected nowhere.
      #
      # It runs before the step below rather than inside it: that step lowers the login limit
      # to five on purpose, and the rest of this file logs in often enough to be refused by
      # it. Nothing here needs the lowered limit -- the flag is read by the test, not the
      # server -- so the two are kept apart. The test pauses the container and unpauses it in
      # a finally, waiting for health before it returns.
      - name: Exercise the general API fail-open during a Redis outage
        shell: bash
        run: |
          set -euo pipefail
          VAULT_REDIS_OUTAGE_TEST=1 \
          VAULT_REDIS_CONTAINER=vault-redis \
            python -m pytest tests/test_api_rate_limit_classes.py::test_general_api_classes_fail_open_during_redis_outage --maxfail=1
          # The test unpauses the container and waits for the API to report the connection
          # back, which is not the same as docker calling it healthy again: a paused
          # container cannot answer its own healthcheck, so that verdict only clears on the
          # next successful probe. The step below recreates a service declared
          # `condition: service_healthy` on redis and fails outright while it is stale.
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' vault-redis 2>/dev/null || echo unknown)"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::vault-redis did not return to healthy after the outage test (last seen: ${status})"
              exit 1
            fi
            sleep 2
          done

      - name: Exercise login throttling and Redis outage fallback
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^RATE_LIMIT_LOGIN_ATTEMPTS=.*/RATE_LIMIT_LOGIN_ATTEMPTS=5/' .env
          docker compose up -d --force-recreate vault-api
          for attempt in $(seq 1 40); do
            body=""
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8200/health 2>/dev/null)"; then
              case "$body" in
                *'"database":"connected"'*) break ;;
              esac
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "::error::vault-api did not return after restoring shipped limits"
              exit 1
            fi
            sleep 3
          done
          docker compose exec -T vault-redis redis-cli FLUSHALL
          VAULT_REDIS_OUTAGE_TEST=1 \
          VAULT_REDIS_CONTAINER=vault-redis \
            python -m pytest tests/test_login_throttle.py --maxfail=1

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=400

      - name: Tear the stack down
        if: always()
        run: docker compose down -v --remove-orphans
