name: Fast tests

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  # Called by the Tests workflow when it runs on a release candidate or inside a release, so the one
  # set of lanes that installs only the test lock also gates the commit that reaches main and is
  # published -- not only pull requests and the push that follows a merge.
  workflow_call:
    inputs:
      expected_sha:
        description: Commit the lanes must test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fast-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Tags, because part of the offline lane checks the upgrade matrix against the releases
          # that actually exist. Tags only, not full history: the check reads `git tag -l`, so
          # fetch-depth: 0 would slow every run to fetch commits nothing looks at.
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-test.lock

      - name: Install locked test dependencies
        run: |
          python -m pip install -r tests/requirements-test.lock
          python -m pip check

      - name: Parse the shell setup shim
        shell: bash
        run: bash -n setup-secure.sh

      - name: Parse the PowerShell setup shim
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "setup-secure.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors) { throw ($errors | Out-String) }

      - name: Compile the management tool
        run: python -m py_compile dockvault.py

      - name: Run the offline fast lane
        run: python -m pytest -m "unit and not docker" --maxfail=1
