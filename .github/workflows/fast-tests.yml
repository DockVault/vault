name: Fast tests

on:
  pull_request:
  push:
    # main and each maintenance line release/X.Y; candidates run these lanes through Tests.
    branches: ["main", "release/[0-9]+.[0-9]+"]
  workflow_dispatch: {}
  # Called by the Tests workflow when it runs on a release candidate or inside a release, so the one
  # set of lanes that installs only the test lock also gates the commit that reaches main and is
  # published -- not only pull requests and the push that follows a merge.
  workflow_call:
    inputs:
      expected_sha:
        description: Commit the lanes must test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fast-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The limit is there to end a hang, not to budget a normal run. The offline lane (about 11,000 tests)
    # takes about 17 minutes on Linux and 53 to 69 on Windows, where the audit chain's tests spend most of
    # their time on file opens, renames and lookups, and SQLite looks on the disk for a journal file at each
    # statement. A limit of 25 minutes cancelled the Windows lane with no test failing, so Windows has 120,
    # about twice a run there. A Linux run takes about 23 minutes with installing, so Linux has 45.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 120 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Tags and history, because part of the offline lane checks the upgrade matrix against the
          # releases that actually exist (`git tag -l`) and against the versions this commit's
          # history prepared (`git log -- VERSION`): two candidates cut the same day are tested
          # before either is tagged.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-test.lock

      - name: Install locked test dependencies
        run: |
          python -m pip install -r tests/requirements-test.lock
          python -m pip check

      - name: Parse the shell setup shim
        shell: bash
        run: bash -n setup-secure.sh

      - name: Parse the PowerShell setup shim
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "setup-secure.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors) { throw ($errors | Out-String) }

      - name: Compile the management tool
        run: python -m py_compile dockvault.py

      - name: Run the offline fast lane
        run: python -m pytest -m "unit and not docker" --maxfail=1
