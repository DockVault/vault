name: Setup matrix

# Drives dockvault.py against real Docker, in the states a self-hosting operator actually reaches:
# a first install, a re-run over existing data, a backup/restore round trip, a mismatched .env, a
# split deployment, and an install from the published image rather than a source build.
# tests/test_dockvault_tool.py already covers the tool's REASONING thoroughly —
# 124 tests — but every one of them injects a fake `run` hook, so nothing has ever checked that the
# tool can actually stand a deployment up, or that re-running it leaves a user's data where it was.
#
# That gap is not theoretical: the guardrail protecting an operator from "existing volume + fresh
# .env" (Postgres bakes its password in on first init and never re-reads it) is only ever exercised
# by hand today.
#
# Safe here in a way it is not on a workstation: the composes pin `name: dockvault-vault` and fixed
# container_names, so two deployments cannot coexist on one Docker daemon — a runner is a throwaway
# VM with none, so scenarios cannot collide with anything real.
#
# Every pull request runs this lifecycle. Its Docker work waits for the same reusable strict
# collection/offline gate as the full integration suite; schedule and manual runs keep that gate too.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  pull_request:
  workflow_call:
    inputs:
      expected_sha:
        description: Commit that every release gate must test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: setup-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixed for the run so every scenario can log back in and compare. Throwaway: this deployment
  # exists for ~10 minutes inside a runner and is never reachable from outside it.
  ADMIN_USER: admin
  BASE: https://localhost:8443
  WEB_PORT: "8443"
  SFTP_PORT: "2222"

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
    permissions:
      contents: read

  scenarios:
    name: dockvault.py against real Docker
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          # Nothing here pushes, and the job builds and runs a Dockerfile that is
          # attacker-authored on a fork pull request.
          persist-credentials: false

      - name: Verify requested commit
        if: ${{ inputs.expected_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Generate and mask the throwaway admin credential
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_PASS="$(openssl rand -base64 24)"
          echo "::add-mask::${ADMIN_PASS}"
          echo "ADMIN_PASS=${ADMIN_PASS}" >> "$GITHUB_ENV"

      - name: Scenario A — first install
        run: |
          set -euo pipefail
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          test -f .env || { echo "::error::setup did not write .env"; exit 1; }
          python3 .github/scripts/mask_env_secrets.py .env
          test -f certs/cert.pem || { echo "::error::setup did not write a certificate"; exit 1; }
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS"
          echo "A: installed and reachable"

      - name: Scenario A2 — SFTP actually answers
        # --enable-sftp is a claim about a listening service, so read the SSH banner rather than
        # trusting a successful TCP connect: docker-proxy binds the published port as soon as the
        # container is created, whether or not anything inside is serving.
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            banner="$(timeout 5 bash -c "exec 3<>/dev/tcp/127.0.0.1/${SFTP_PORT}; head -c 4 <&3" 2>/dev/null || true)"
            case "$banner" in SSH-*) echo "A2: SFTP greeted after ${attempt} attempt(s)"; exit 0 ;; esac
            sleep 3
          done
          echo "::error::SFTP never presented an SSH banner on ${SFTP_PORT}"
          docker compose -f docker-compose.secure.yml logs --no-color --tail=100
          exit 1

      - name: Plant data to prove continuity against
        run: |
          set -euo pipefail
          token="$(curl -sS --cacert certs/cert.pem -X POST "$BASE/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASS\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "::add-mask::${token}"
          curl -sS --cacert certs/cert.pem -X POST "$BASE/vaults" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"name":"matrix-marker","description":"planted before the re-runs"}' -o /dev/null
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" > /tmp/state-planted.json
          # Identity alone, for the profile transitions: those deliberately CHANGE the topology,
          # and health describes the topology (combined serves SFTP from the web container, split
          # from its own). What must survive a transition is the data, not the shape.
          python3 .github/scripts/deployment_state.py --identity-only "$BASE" "$ADMIN_USER" "$ADMIN_PASS" \
            > /tmp/identity-planted.json
          grep -q matrix-marker <(curl -sS --cacert certs/cert.pem "$BASE/vaults" -H "Authorization: Bearer $token") \
            || { echo "::error::the marker vault was not created"; exit 1; }
          echo "planted: $(cat /tmp/state-planted.json)"

      - name: Scenario B — re-run over existing data keeps it
        # The upgrade path. Re-running setup must adopt the existing .env and leave the deployment
        # identical; regenerating secrets here would strand the data behind a password Postgres
        # will not re-read.
        run: |
          set -euo pipefail
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp \
            | tee /tmp/setup-rerun.log
          grep -qi "reusing the existing .env" /tmp/setup-rerun.log \
            || { echo "::error::the re-run did not report reusing the existing .env"; exit 1; }
          # The web port IS busy on a re-run — held by the deployment's own container, which compose
          # is about to recreate on that same port. Warning there sends the operator hunting for a
          # conflict that does not exist.
          grep -qi "already in use" /tmp/setup-rerun.log \
            && { echo "::error::the re-run false-warned about its own web port"; exit 1; } || true
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" > /tmp/state-after-rerun.json
          diff /tmp/state-planted.json /tmp/state-after-rerun.json \
            || { echo "::error::the deployment changed across a setup re-run"; exit 1; }
          echo "B: data, users and vault ids all survived"

      - name: Scenario C — the coupling stamp makes the next run instant
        # The first re-run pays a ~30s database auth probe and stamps the volume; every run after
        # should recognise the stamp instead of starting Postgres again. If this regresses, the
        # only symptom is a slower setup, so nothing else would ever catch it.
        run: |
          set -euo pipefail
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp \
            | tee /tmp/setup-third.log
          grep -qi "stamp matches" /tmp/setup-third.log \
            || { echo "::error::the coupling stamp was not used on the third run"; sed -n '1,60p' /tmp/setup-third.log; exit 1; }
          grep -qi "already in use" /tmp/setup-third.log \
            && { echo "::error::the re-run false-warned about its own web port"; exit 1; } || true
          echo "C: stamp fast path used"

      - name: Scenario D — backup, destroy, restore
        run: |
          set -euo pipefail
          python3 dockvault.py backup --non-interactive --action backup --backup-dir /tmp/dvbundles
          bundle="$(find /tmp/dvbundles -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$bundle" || { echo "::error::backup produced no bundle"; exit 1; }
          echo "bundle: $bundle"

          python3 dockvault.py reset --non-interactive --confirm
          docker volume ls --format '{{.Name}}' | grep -q '^dockvault-vault_vault_pg_data$' \
            && { echo "::error::reset left the data volume behind"; exit 1; } || true

          python3 dockvault.py backup --non-interactive --action restore --bundle-dir "$bundle" --force
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" > /tmp/state-restored.json
          diff /tmp/state-planted.json /tmp/state-restored.json \
            || { echo "::error::restore did not bring the deployment back intact"; exit 1; }
          echo "D: backup -> destroy -> restore round-tripped"

      - name: Scenario E — a mismatched .env must be refused, not started
        # The data-safety guardrail. Postgres bakes its password into the volume on first init, so
        # a regenerated .env cannot open existing data — the app would loop on "password
        # authentication failed". Setup has to refuse, keep the volume, and say so without printing
        # a secret. A pass here that started the stack anyway would be the worst outcome in the file.
        run: |
          set -euo pipefail
          docker compose -f docker-compose.secure.yml down --remove-orphans >/dev/null 2>&1 || true
          mv .env /tmp/env.good
          set +e
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp \
            > /tmp/setup-mismatch.log 2>&1
          set -e
          python3 .github/scripts/mask_env_secrets.py .env
          grep -qiE "does NOT match the existing data volume" /tmp/setup-mismatch.log \
            || { echo "::error::a mismatched .env was not detected"; cat /tmp/setup-mismatch.log; exit 1; }
          grep -qi "not starting" /tmp/setup-mismatch.log \
            || { echo "::error::setup did not refuse to start on a mismatched .env"; exit 1; }
          # the refusal must not leak either secret it compared
          for secret in "$(grep '^VAULT_DB_PASSWORD=' /tmp/env.good | cut -d= -f2-)" \
                        "$(grep '^ENCRYPTION_KEY=' /tmp/env.good | cut -d= -f2-)"; do
            if [ -n "$secret" ] && grep -qF -- "$secret" /tmp/setup-mismatch.log; then
              echo "::error::the mismatch report printed a secret"; exit 1
            fi
          done
          docker volume ls --format '{{.Name}}' | grep -q '^dockvault-vault_vault_pg_data$' \
            || { echo "::error::the refusal destroyed the data volume"; exit 1; }
          # and the original .env still opens it
          mv /tmp/env.good .env
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" > /tmp/state-recovered.json
          diff /tmp/state-planted.json /tmp/state-recovered.json \
            || { echo "::error::the documented recovery path did not restore access"; exit 1; }
          echo "E: refused the mismatch, kept the data, and the real .env still opens it"

      - name: Profile transition — combined to split preserves deployment
        shell: bash
        run: |
          set -euo pipefail
          docker volume ls --filter label=com.dockvault.managed=true --format '{{.Name}}' \
            | sort > /tmp/volumes-before-profile-transition
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=split/' .env
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          python3 .github/scripts/deployment_state.py --identity-only "$BASE" "$ADMIN_USER" "$ADMIN_PASS" \
            > /tmp/identity-profile-split.json
          diff /tmp/identity-planted.json /tmp/identity-profile-split.json \
            || { echo "::error::combined-to-split changed deployment state"; exit 1; }
          # Health is asserted on its own terms rather than by byte-equality: the payload legitimately
          # differs across the transition (SFTP moves to its own container), but the deployment must
          # not report itself broken afterwards. It used to — the api-only container probed its own
          # loopback for an SFTP server that lives elsewhere and called it unreachable.
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" \
            | python3 -c 'import json,sys; h=json.load(sys.stdin)["health"]; print(h); sys.exit(0 if h["status"]=="healthy" else 1)' \
            || { echo "::error::split deployment reports itself degraded"; exit 1; }
          docker volume ls --filter label=com.dockvault.managed=true --format '{{.Name}}' \
            | sort > /tmp/volumes-after-profile-split
          diff /tmp/volumes-before-profile-transition /tmp/volumes-after-profile-split \
            || { echo "::error::combined-to-split changed the volume set"; exit 1; }
          actual="$(docker ps -a --format '{{.Names}}' \
            | grep -E '^vault(-api|-sftp|-db|-redis)?$' | sort)"
          expected="$(printf '%s\n' vault-api vault-db vault-redis vault-sftp | sort)"
          [ "$actual" = "$expected" ] || {
            echo "::error::split transition left an unexpected container inventory"
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          }
          for attempt in $(seq 1 20); do
            banner="$(timeout 5 bash -c "exec 3<>/dev/tcp/127.0.0.1/${SFTP_PORT}; head -c 4 <&3" 2>/dev/null || true)"
            case "$banner" in SSH-*) break ;; esac
            [ "$attempt" -lt 20 ] || { echo "::error::split transition lost SFTP"; exit 1; }
            sleep 3
          done
          echo "profile transition: combined -> split preserved state, volumes, and SFTP"

      - name: Profile transition — split to combined preserves deployment
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=combined/' .env
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          python3 .github/scripts/deployment_state.py --identity-only "$BASE" "$ADMIN_USER" "$ADMIN_PASS" \
            > /tmp/identity-profile-combined.json
          diff /tmp/identity-planted.json /tmp/identity-profile-combined.json \
            || { echo "::error::split-to-combined changed deployment state"; exit 1; }
          # Back in combined the SFTP server IS in this container again, so health must not merely
          # be healthy - it must report SFTP actually listening, which is what proves the marker is
          # set on the way back and the check did not simply stop looking.
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" \
            | python3 -c 'import json,sys; h=json.load(sys.stdin)["health"]; print(h); sys.exit(0 if h["status"]=="healthy" and h["sftp"]=="listening" else 1)' \
            || { echo "::error::combined deployment does not report SFTP listening"; exit 1; }
          docker volume ls --filter label=com.dockvault.managed=true --format '{{.Name}}' \
            | sort > /tmp/volumes-after-profile-combined
          diff /tmp/volumes-before-profile-transition /tmp/volumes-after-profile-combined \
            || { echo "::error::split-to-combined changed the volume set"; exit 1; }
          actual="$(docker ps -a --format '{{.Names}}' \
            | grep -E '^vault(-api|-sftp|-db|-redis)?$' | sort)"
          expected="$(printf '%s\n' vault vault-db vault-redis | sort)"
          [ "$actual" = "$expected" ] || {
            echo "::error::combined transition left an unexpected container inventory"
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          }
          for attempt in $(seq 1 20); do
            banner="$(timeout 5 bash -c "exec 3<>/dev/tcp/127.0.0.1/${SFTP_PORT}; head -c 4 <&3" 2>/dev/null || true)"
            case "$banner" in SSH-*) break ;; esac
            [ "$attempt" -lt 20 ] || { echo "::error::combined transition lost SFTP"; exit 1; }
            sleep 3
          done
          echo "profile transition: split -> combined preserved state, volumes, and SFTP"

      - name: New volume set and paired-env repoint round trip
        shell: bash
        run: |
          set -euo pipefail
          original_prefix="$(python3 - <<'PY'
          import dockvault
          print(dockvault.volume_prefix(dockvault.parse_env(open('.env', encoding='utf-8').read())))
          PY
          )"
          docker volume ls --filter label=com.dockvault.managed=true --format '{{.Name}}' \
            | grep "^${original_prefix}_" | sort > /tmp/original-volume-set
          python3 dockvault.py volumes --non-interactive --action new
          test -f ".env.${original_prefix}" \
            || { echo "::error::new-set action did not archive the original paired env"; exit 1; }
          python3 .github/scripts/mask_env_secrets.py .env
          new_prefix="$(python3 - <<'PY'
          import dockvault
          print(dockvault.volume_prefix(dockvault.parse_env(open('.env', encoding='utf-8').read())))
          PY
          )"
          [ "$new_prefix" != "$original_prefix" ] \
            || { echo "::error::new-set action reused the original volume prefix"; exit 1; }
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" \
            > /tmp/state-new-volume-set.json
          python3 - <<'PY'
          import json
          state = json.load(open('/tmp/state-new-volume-set.json', encoding='utf-8'))
          if state['vault_ids']:
              raise SystemExit('::error::new volume set was not empty')
          PY
          docker volume ls --filter label=com.dockvault.managed=true --format '{{.Name}}' \
            | grep "^${new_prefix}_" | sort > /tmp/new-volume-set
          [ "$(wc -l < /tmp/new-volume-set)" -eq 5 ] \
            || { echo "::error::new set did not create its complete five-volume inventory"; cat /tmp/new-volume-set; exit 1; }
          python3 dockvault.py volumes --non-interactive --action repoint \
            --target-prefix "$original_prefix" --env-source ".env.${original_prefix}"
          test -f ".env.${new_prefix}" \
            || { echo "::error::repoint did not archive the new set's paired env"; exit 1; }
          python3 .github/scripts/mask_env_secrets.py .env
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" \
            > /tmp/state-after-volume-repoint.json
          diff /tmp/state-planted.json /tmp/state-after-volume-repoint.json \
            || { echo "::error::repoint did not recover the original deployment"; exit 1; }
          while IFS= read -r volume; do
            docker volume inspect "$volume" >/dev/null
          done < /tmp/original-volume-set
          while IFS= read -r volume; do
            docker volume inspect "$volume" >/dev/null
          done < /tmp/new-volume-set
          echo "volume round trip: empty new set and original state both survived paired-env repoint"

      - name: Scenario F — split deployment
        run: |
          set -euo pipefail
          python3 dockvault.py reset --non-interactive --confirm
          rm -f .env
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" \
            --enable-sftp --split
          python3 .github/scripts/mask_env_secrets.py .env
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS"
          running="$(docker ps --format '{{.Names}}')"
          echo "$running" | grep -q '^vault-api$'  || { echo "::error::split did not start vault-api"; echo "$running"; exit 1; }
          echo "$running" | grep -q '^vault-sftp$' || { echo "::error::split did not start vault-sftp"; echo "$running"; exit 1; }
          echo "F: split deployment healthy on both containers"

      - name: Scenario G — --no-start authors config without deploying
        run: |
          set -euo pipefail
          python3 dockvault.py reset --non-interactive --confirm
          rm -f .env
          python3 dockvault.py setup --non-interactive --no-start \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT"
          python3 .github/scripts/mask_env_secrets.py .env
          test -f .env || { echo "::error::--no-start did not write .env"; exit 1; }
          test -f certs/cert.pem || { echo "::error::--no-start did not write a certificate"; exit 1; }
          if [ -n "$(docker ps --format '{{.Names}}' | grep -E '^vault(-api|-sftp|-db|-redis)?$' || true)" ]; then
            echo "::error::--no-start started containers anyway"; docker ps; exit 1
          fi
          echo "G: authored config, deployed nothing"

      - name: Scenario H — a refused re-run must leave a RUNNING deployment running
        # The state an operator actually reaches: a live deployment, and a setup re-run whose
        # guardrail refuses. The secret probe drives `docker compose ... vault-db`, and the
        # composes pin `container_name: vault-db` globally — so it acts on the live deployment's
        # database. Stopping it (or recreating it under a different .env) takes the deployment down
        # and, because the guard then exits, leaves it down. Refusing must cost the operator
        # nothing but the run.
        run: |
          set -euo pipefail
          # G left a .env and no containers; stand the deployment back up and prove it healthy.
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" > /tmp/state-h-before.json

          # Force a refusal WITHOUT taking the deployment down first (unlike scenario E): setup
          # authors a fresh .env, whose VAULT_DB_PASSWORD cannot open the existing volume.
          mv .env /tmp/env.h-good
          set +e
          python3 dockvault.py setup --non-interactive \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp \
            > /tmp/setup-h-refused.log 2>&1
          rc=$?
          set -e
          python3 .github/scripts/mask_env_secrets.py .env
          [ "$rc" -ne 0 ] || { echo "::error::the mismatched re-run exited 0"; cat /tmp/setup-h-refused.log; exit 1; }
          grep -qi "not starting" /tmp/setup-h-refused.log \
            || { echo "::error::setup did not refuse"; cat /tmp/setup-h-refused.log; exit 1; }

          # The assertion this scenario exists for.
          running="$(docker inspect -f '{{.State.Running}}' vault-db 2>/dev/null || echo missing)"
          [ "$running" = "true" ] || {
            echo "::error::the refused re-run left the running deployment's database $running"
            docker ps -a; exit 1; }
          mv /tmp/env.h-good .env
          python3 .github/scripts/deployment_state.py "$BASE" "$ADMIN_USER" "$ADMIN_PASS" > /tmp/state-h-after.json
          diff /tmp/state-h-before.json /tmp/state-h-after.json \
            || { echo "::error::the deployment did not survive a refused re-run intact"; exit 1; }
          echo "H: refused without touching the live deployment"

      - name: Scenario J — the storage limit is reported, raised and refused
        # The deployment storage ceiling an operator manages from the host. Runs against the LIVE
        # deployment scenario H left standing, because the two numbers this command exists to
        # report — what the database says is stored, and what the storage volume holds — are only
        # readable from a running stack. The refusal is the point of the scenario: a ceiling below
        # what is already stored would strand files above a limit nothing could satisfy.
        shell: bash
        run: |
          set -euo pipefail
          python3 dockvault.py storage --non-interactive | tee /tmp/storage-show.log
          grep -q "current limit" /tmp/storage-show.log \
            || { echo "::error::storage did not report the current limit"; exit 1; }
          grep -q "stored now" /tmp/storage-show.log \
            || { echo "::error::storage did not report what is stored"; exit 1; }
          grep -qi "unknown" /tmp/storage-show.log \
            && { echo "::error::storage could not read usage from the running deployment"; exit 1; }

          # Set a ceiling and prove the running vault enforces exactly it.
          python3 dockvault.py storage --set-gb 64 --non-interactive
          python3 .github/scripts/mask_env_secrets.py .env
          grep -q "^MAX_STORAGE_GB=64$" .env \
            || { echo "::error::storage did not write MAX_STORAGE_GB"; grep '^MAX_STORAGE_GB' .env || true; exit 1; }
          for attempt in $(seq 1 30); do
            curl -sSf --cacert certs/cert.pem "$BASE/health" >/dev/null 2>&1 && break
            sleep 2
          done
          token="$(curl -sSf --cacert certs/cert.pem -X POST "$BASE/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\": \"$ADMIN_USER\", \"password\": \"$ADMIN_PASS\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          ceiling="$(curl -sSf --cacert certs/cert.pem "$BASE/settings" -H "Authorization: Bearer $token" \
            | python3 -c 'import json,sys; v=json.load(sys.stdin)["deployment_storage_max_gb"]; print(f"{float(v):g}")')"
          [ "$ceiling" = "64" ] \
            || { echo "::error::the vault reports a ceiling of $ceiling, not 64"; exit 1; }

          # An administrator may narrow it from inside the vault, but never widen it past the host.
          over="$(curl -s -o /dev/null -w '%{http_code}' --cacert certs/cert.pem -X PUT "$BASE/settings" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"deployment_storage_limit_gb": 640}')"
          [ "$over" = "400" ] \
            || { echo "::error::the vault accepted a limit above MAX_STORAGE_GB (HTTP $over)"; exit 1; }

          # And the host tool refuses a ceiling below what is already stored.
          stored_gb="$(docker exec vault-db psql -U sftp_user -d sftp_db -tAc \
            'SELECT CEIL(COALESCE(SUM(total_size_bytes), 0)::numeric / (1024^3))::int FROM vaults WHERE is_active')"
          if [ "${stored_gb:-0}" -gt 0 ]; then
            set +e
            python3 dockvault.py storage --set-gb 0 --non-interactive > /tmp/storage-refuse.log 2>&1
            rc=$?
            set -e
            [ "$rc" -ne 0 ] || { echo "::error::storage accepted a limit below what is stored"; exit 1; }
            grep -q "already stored" /tmp/storage-refuse.log \
              || { echo "::error::the refusal did not say why"; cat /tmp/storage-refuse.log; exit 1; }
          fi

          python3 dockvault.py storage --set-gb -1 --non-interactive --no-restart
          python3 .github/scripts/mask_env_secrets.py .env
          echo "J: storage limit reported, enforced by the vault, and refused when it would strand files"

      - name: Scenario I — install from the published release image
        # The path a self-hoster takes when they do not want to build: setup pulls the published
        # image instead of compiling this checkout. Nothing else in this file covers it, and for a
        # long time nothing in the tool did either — every install built from source, so the
        # published image was reachable only by hand-editing .env.
        #
        # Runs LAST on purpose: it is the one scenario whose containers are NOT built from the code
        # under test, so it must not be able to influence anything above it.
        #
        # VERSION is pinned to the newest PUBLISHED release for the duration. `main` sits ahead of
        # the registry for most of its life, so keying off the checkout's own VERSION would make
        # this scenario silently test the fallback instead — which the step after this one asserts
        # deliberately.
        shell: bash
        env:
          # Authenticated: an anonymous read shares an IP rate limit with every other job on
          # the runner fleet. contents: read is all this needs.
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Retried, and checked. A degraded API answers 200 with an empty list, which is
          # indistinguishable from a repository that has never published a release -- and
          # taking the first element of it raised a bare StopIteration naming neither.
          published=""
          for attempt in $(seq 1 5); do
            body="$(curl -sS \
                      -H "Authorization: Bearer ${GH_API_TOKEN}" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      https://api.github.com/repos/DockVault/vault/releases || true)"
            published="$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((r["tag_name"] for r in d if isinstance(r, dict) and not r.get("draft")), ""))' 2>/dev/null || true)"
            [ -n "$published" ] && break
            echo "the releases list came back empty or unreadable (attempt ${attempt} of 5)"
            sleep 10
          done
          if [ -z "$published" ]; then
            echo "::error::could not find a published release of DockVault/vault to install. The releases API returned nothing usable after 5 attempts, so this scenario has no version to pin."
            exit 1
          fi
          echo "newest published release: $published"
          cp VERSION "$RUNNER_TEMP/VERSION.checkout"
          printf '%s\n' "${published#v}" > VERSION

          python3 dockvault.py reset --non-interactive --confirm
          rm -f .env
          python3 dockvault.py setup --non-interactive --image-source release \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" --enable-sftp \
            | tee /tmp/setup-release.log
          python3 .github/scripts/mask_env_secrets.py .env
          cp "$RUNNER_TEMP/VERSION.checkout" VERSION

          expected="ghcr.io/dockvault/vault:${published}"
          grep -q "^DOCKVAULT_IMAGE=${expected}$" .env \
            || { echo "::error::setup did not pin the published image"; grep '^DOCKVAULT_IMAGE=' .env || true; exit 1; }
          grep -qi "published release" /tmp/setup-release.log \
            || { echo "::error::setup did not report that it was pulling a release"; exit 1; }

          # It must have PULLED, not built. A local build would wear the very same reference, so
          # the reference proves nothing on its own: only an image that came from the registry
          # carries a repo digest.
          expected_id="$(docker image inspect -f '{{.Id}}' "$expected")"
          running_id="$(docker inspect -f '{{.Image}}' vault)"
          [ "$running_id" = "$expected_id" ] \
            || { echo "::error::the container is not running $expected"; exit 1; }
          [ "$(docker image inspect -f '{{len .RepoDigests}}' "$expected")" -gt 0 ] \
            || { echo "::error::$expected has no repo digest - it was built locally, not pulled"; exit 1; }
          echo "running $expected ($(docker image inspect -f '{{index .RepoDigests 0}}' "$expected"))"

          # And it has to actually serve.
          for attempt in $(seq 1 20); do
            if curl -sSf --cacert certs/cert.pem "$BASE/health" >/dev/null 2>&1; then
              echo "I: published image installed and serving"; exit 0
            fi
            sleep 3
          done
          echo "::error::the published image never answered /health"
          docker compose -f docker-compose.secure.yml logs --no-color --tail=100
          exit 1

      - name: Scenario I2 — an unpublished version falls back to a source build
        # The other half of the decision. A checkout whose VERSION was never released must not
        # author a .env pinned to an image that cannot be pulled — that would strand the operator
        # on a failure AFTER their configuration was written.
        shell: bash
        run: |
          set -euo pipefail
          cp VERSION "$RUNNER_TEMP/VERSION.checkout"
          printf '99.0.0\n' > VERSION

          python3 dockvault.py reset --non-interactive --confirm
          rm -f .env
          python3 dockvault.py setup --non-interactive --image-source release --no-start \
            --server-name localhost \
            --admin-username "$ADMIN_USER" --admin-email admin@dockvault-matrix.com \
            --admin-password "$ADMIN_PASS" \
            --cert-mode selfsigned --web-port "$WEB_PORT" --sftp-port "$SFTP_PORT" \
            | tee /tmp/setup-unpublished.log
          python3 .github/scripts/mask_env_secrets.py .env
          cp "$RUNNER_TEMP/VERSION.checkout" VERSION

          grep -qi "not published" /tmp/setup-unpublished.log \
            || { echo "::error::setup did not report the unpublished version"; cat /tmp/setup-unpublished.log; exit 1; }
          grep -q '^DOCKVAULT_IMAGE=' .env \
            && { echo "::error::setup pinned an image that was never published"; exit 1; } || true
          echo "I2: fell back to a source build without pinning an unpullable image"

      - name: Deployment logs
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f docker-compose.secure.yml logs --no-color --tail=300 || true

      - name: Tear down
        if: always()
        run: |
          python3 dockvault.py reset --non-interactive --confirm || true
          docker compose -f docker-compose.secure.yml down -v --remove-orphans || true
          docker volume ls --filter label=com.dockvault.managed=true --format '{{.Name}}' \
            | xargs -r docker volume rm || true
